# Host network, so the VPS firewall sees the caller's address.
# Docker's published-port proxy would hide that address and bypass ufw.
services:
  thumbnail-generator:
    build:
      context: .
      network: host
    image: thumbnail-generator:local
    init: true
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: ${PORT:-6020}
      MAX_BYTES: ${MAX_BYTES:-41943040}
      TIMEOUT_SECONDS: ${TIMEOUT_SECONDS:-60}
      MAX_CONCURRENCY: ${MAX_CONCURRENCY:-2}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['PORT'] + '/health')\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
