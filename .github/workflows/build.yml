name: build

on:
  push:
  pull_request:

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker compose build
      - name: Serve health on the published port
        run: |
          docker compose up -d --wait
          curl -fsS http://127.0.0.1:6020/health
          docker compose down
